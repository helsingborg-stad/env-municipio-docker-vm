# Swarm manages the application only. MariaDB and Caddy stay per-VM Compose services
# from compose.yaml, because both own node-local state that must never be rescheduled.
services:
  municipio:
    image: ${MUNICIPIO_IMAGE:?MUNICIPIO_IMAGE is required}
    environment:
      WP_CONF_DB_NAME: ${DB_NAME}
      WP_CONF_DB_USER: ${DB_USER}
      WP_CONF_DB_PASSWORD: ${DB_PASSWORD}
      WP_CONF_DB_HOST: ${DB_HOST:-localhost:/run/mysqld/mysqld.sock}
      WP_CONF_DB_TABLE_PREFIX: ${DB_TABLE_PREFIX:-mun_}
      WP_CONF_WP_HOME: https://${SITE_ADDRESS}
      WP_CONF_WP_SITEURL: https://${SITE_ADDRESS}/wp
      WP_CONF_WP_SITE_TITLE: ${WP_SITE_TITLE:-Municipio}
      WP_CONF_WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_CONF_WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_CONF_WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_CONF_WP_DEBUG: ${WP_DEBUG:-false}
      # LiteSpeed Page Cache is independent of Redis object cache and must be
      # active on both standalone and Gluster-backed cluster deployments.
      ENABLE_LS_CACHE: "true"
      # New environment files set this explicitly: enabled on standalone,
      # disabled on shared-filesystem cluster nodes. Keep the old safe default for
      # legacy environment files, which an installer re-run must not rewrite.
      WP_CONF_WP_REDIS_DISABLED: ${WP_REDIS_DISABLED:-true}
    ports:
      - target: 80
        published: ${APP_BIND_PORT:-8080}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${DB_SOCKET_DIR}
        target: /run/mysqld
        read_only: true
      - type: bind
        source: ${DATA_ROOT}/uploads
        target: /var/www/vhosts/localhost/html/wp-content/uploads
      - type: bind
        source: ${DATA_ROOT}/cache
        target: /var/www/vhosts/localhost/html/wp-content/cache
      # OpenLiteSpeed stores rendered page entries here. DATA_ROOT is the
      # GlusterFS view in cluster mode, so page cache contents are replicated.
      - type: bind
        source: ${DATA_ROOT}/cache/litespeed
        target: /usr/local/lsws/cachedata
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.municipio.data == true
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        monitor: 30s
        failure_action: rollback
