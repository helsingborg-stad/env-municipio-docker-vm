services:
  # MariaDB shares the host network namespace so that bind-address, the published port
  # matrix and Galera replication behave exactly as they did with the distribution
  # package. The application never reaches it over the network: DB_SOCKET_DIR is the
  # only connection path, mounted read-only into the application container.
  db:
    image: ${MARIADB_IMAGE:?MARIADB_IMAGE is required}
    container_name: municipio-db
    restart: unless-stopped
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      # Without this the image also creates root@'%'.
      MARIADB_ROOT_HOST: localhost
    volumes:
      - "${DB_DATA_ROOT}:/var/lib/mysql"
      - "${DB_SOCKET_DIR}:/run/mysqld"
      - "${CONFIG_ROOT:-/etc/municipio}/mariadb:/etc/mysql/conf.d:ro"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Caddy also uses the host network namespace: it owns ports 80/443 on the VM, keeps
  # real client addresses, and reaches the local application task at the same loopback
  # address in both Compose and Swarm mode.
  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    container_name: municipio-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      # The directory is mounted, not the file: an in-place config replacement swaps the
      # inode and would detach a single-file bind mount.
      - "${CONFIG_ROOT:-/etc/municipio}/caddy:/etc/caddy:ro"
      - "${HEALTH_ROOT}:/var/lib/municipio/health:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  municipio:
    image: ${MUNICIPIO_IMAGE:?MUNICIPIO_IMAGE is required}
    container_name: municipio-app
    restart: unless-stopped
    environment:
      WP_CONF_DB_NAME: ${DB_NAME}
      WP_CONF_DB_USER: ${DB_USER}
      WP_CONF_DB_PASSWORD: ${DB_PASSWORD}
      WP_CONF_DB_HOST: ${DB_HOST:-localhost:/run/mysqld/mysqld.sock}
      WP_CONF_DB_TABLE_PREFIX: ${DB_TABLE_PREFIX:-mun_}
      WP_CONF_WP_HOME: https://${SITE_ADDRESS}
      WP_CONF_WP_SITEURL: https://${SITE_ADDRESS}/wp
      WP_CONF_WP_SITE_TITLE: ${WP_SITE_TITLE:-Municipio}
      WP_CONF_WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_CONF_WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_CONF_WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_CONF_WP_DEBUG: ${WP_DEBUG:-false}
      WP_CONF_WP_REDIS_DISABLED: ${WP_REDIS_DISABLED:-true}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_BIND_PORT:-8080}:80"
    volumes:
      - "${DB_SOCKET_DIR}:/run/mysqld:ro"
      - "${DATA_ROOT}/uploads:/var/www/vhosts/localhost/html/wp-content/uploads"
      - "${DATA_ROOT}/cache:/var/www/vhosts/localhost/html/wp-content/cache"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

volumes:
  caddy_data:
  caddy_config:
